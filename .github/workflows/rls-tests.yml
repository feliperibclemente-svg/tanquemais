name: Testes de RLS

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Toda segunda-feira às 06:00 UTC (03:00 em São Paulo)
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: rls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    name: Suíte RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: anon
            path: tests/rls/anon.test.ts
          - name: authenticated
            path: tests/rls/authenticated.test.ts
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache de dependências (bun)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Rodar testes de RLS (${{ matrix.suite.name }})
        env:
          CI: "true"
          RLS_REPORT_NAME: ${{ matrix.suite.name }}
          # Chaves públicas do projeto (anon/publishable). Configure em
          # Settings > Secrets and variables > Actions caso queira sobrescrever.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Opcionais: habilitam os cenários de usuário logado / clube / seguidor.
          TANQUE_TEST_EMAIL_A: ${{ secrets.TANQUE_TEST_EMAIL_A }}
          TANQUE_TEST_PASSWORD_A: ${{ secrets.TANQUE_TEST_PASSWORD_A }}
          TANQUE_TEST_EMAIL_B: ${{ secrets.TANQUE_TEST_EMAIL_B }}
          TANQUE_TEST_PASSWORD_B: ${{ secrets.TANQUE_TEST_PASSWORD_B }}
        run: bunx vitest run ${{ matrix.suite.path }}

      - name: Publicar relatório JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-report-${{ matrix.suite.name }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Resumo dos testes no job
        if: always()
        run: |
          echo "### Testes de RLS — ${{ matrix.suite.name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "reports/junit-${{ matrix.suite.name }}.xml" ]; then
            grep -o 'tests="[0-9]*"\|failures="[0-9]*"\|errors="[0-9]*"\|skipped="[0-9]*"' \
              "reports/junit-${{ matrix.suite.name }}.xml" | head -n 8 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nenhum relatório gerado." >> "$GITHUB_STEP_SUMMARY"
          fi

  rls-status:
    name: Permissões de leitura (GRANTs + RLS)
    runs-on: ubuntu-latest
    needs: rls
    if: always()
    steps:
      - name: Falhar se alguma suíte falhou
        run: |
          if [ "${{ needs.rls.result }}" != "success" ]; then
            echo "Regressão de permissões detectada (${{ needs.rls.result }})."
            exit 1
          fi
          echo "Todas as suítes de RLS passaram."
