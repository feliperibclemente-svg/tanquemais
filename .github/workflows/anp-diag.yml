name: Diagnóstico ANP (temporário)
on:
  push:
    branches: [diagnostico/anp-postos]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run scripts/anp-postos-diag.ts
