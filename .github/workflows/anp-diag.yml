name: Diagnóstico ANP (temporário)
on:
  push:
    branches: [diagnostico/anp-postos]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bun run scripts/anp-postos-diag.ts > out.txt 2>&1 || true
          head -c 60000 out.txt | python3 -c "import sys; d=sys.stdin.read(); print('::notice title=diag::' + d.replace('%','%25').replace('\r','').replace('\n','%0A'))"
