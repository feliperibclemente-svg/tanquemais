<!doctype html>
<html lang="pt-BR">
<body style="margin:0;padding:0;background:#f4f6f5;font-family:Arial,Helvetica,sans-serif;color:#141a2c;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f5;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px 28px;">
        <tr><td style="font-size:22px;font-weight:bold;color:#178559;padding-bottom:24px;">Tanque+</td></tr>
        <tr><td style="font-size:20px;font-weight:bold;padding-bottom:12px;">Confirme seu novo e-mail</td></tr>
        <tr><td style="font-size:15px;line-height:1.6;color:#3d4458;padding-bottom:24px;">Para trocar o e-mail da sua conta de <strong>{{ .Email }}</strong> para <strong>{{ .NewEmail }}</strong>, toque no botão abaixo.</td></tr>
        <tr><td style="padding-bottom:24px;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#178559;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px;padding:14px 24px;border-radius:999px;">Confirmar novo e-mail</a>
        </td></tr>
        <tr><td style="font-size:13px;line-height:1.6;color:#6b7280;">Se você não pediu essa troca, ignore este e-mail e considere trocar sua senha.</td></tr>
      </table>
      <p style="font-size:12px;color:#9ca3af;margin-top:16px;">Tanque+ · controle de combustível · tanquemais.com.br</p>
    </td></tr>
  </table>
</body>
</html>
